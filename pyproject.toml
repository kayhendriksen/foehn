[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "foehn"
version = "0.5.0"
description = "Python toolkit for Swiss weather data — download, query, and analyse MeteoSwiss Open Government Data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kay Hendriksen" },
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    # Verified against the suite, and the databricks extra's floor too. 1.18
    # cannot stream the forecast join to Parquet ("sink_parquet ... not yet
    # supported in standard engine"), so every forecast_local conversion failed.
    "polars>=1.34",
    # Imported directly in fetch.py (Retry). It arrives via requests today, but
    # relying on a transitive dep breaks silently if requests ever swaps backends.
    # Floor is where Retry gained allowed_methods.
    "urllib3>=1.26",
]
keywords = ["meteoswiss", "weather", "parquet", "delta", "open-data", "switzerland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kayhendriksen/foehn"
Documentation = "https://kayhendriksen.github.io/foehn/"
Repository = "https://github.com/kayhendriksen/foehn"
Changelog = "https://github.com/kayhendriksen/foehn/blob/main/CHANGELOG.md"
Issues = "https://github.com/kayhendriksen/foehn/issues"

[project.scripts]
foehn = "foehn.cli:main"

[project.optional-dependencies]
databricks = [
    # Polars' build for CPUs without AVX2. It used to be the separate
    # polars-lts-cpu distribution, which ships the same ``polars`` package as the
    # core dependency: installed together, each overwrote the other's files and
    # could leave a polars that no longer imports. Since 1.34 it is a runtime
    # extra of polars itself, and polars loads it in preference when present.
    "polars[rtcompat]>=1.34",
    "pyspark>=3.5,<5.0",
    "delta-spark>=2.4,<5.0",
]
mcp = [
    "mcp[cli]>=2.0",
    # mcp_server.py imports BaseModel/Field directly rather than only through mcp.
    "pydantic>=2.0",
]
# Everything for the gridded (xarray) read path, across all formats:
#   NetCDF (climate grids)  -> netCDF4, h5netcdf, h5py
#   GRIB2  (forecasts)      -> cfgrib, eccodes   (eccodes ships a system C lib)
#   HDF5   (ODIM radar)      -> h5py, pyproj
# plus zarr for to_zarr(). One extra keeps install simple; note eccodes can be
# the fragile piece on some platforms.
grids = [
    "xarray>=2024.1",
    # Imported directly in grids.py; arrives via xarray/netCDF4 but is ours to declare.
    "numpy>=1.24",
    "netCDF4>=1.6",
    "h5netcdf>=1.0",
    "h5py>=3.0",
    "zarr>=3.0",
    "cfgrib>=0.9.12",
    # From 2.43 the ecCodes C library ships in eccodeslib rather than inside the
    # eccodes wheels. eccodes declares it only in its py3-none-any wheel, which
    # uv's universal lock does not read (it takes the Windows wheel's metadata,
    # where the library is bundled), so a uv-managed install had no ecCodes
    # library at all on Linux and macOS. Stated here, every installer gets it.
    "eccodes>=2.43",
    "eccodeslib>=2.43; platform_system != 'Windows'",
    "pyproj>=3.0",
]

# Development dependencies (PEP 735). Not extras: an extra is published metadata,
# so `pip install foehn[dev]` used to pull a linter, a type checker and pytest
# into a user's environment. uv installs the dev group by default (`uv sync`,
# `uv run`); nothing outside this repository ever sees it.
[dependency-groups]
dev = [
    # Runs the hooks in .pre-commit-config.yaml. In the group rather than run
    # through uvx, so `uv run pre-commit install` writes a git hook pointing at
    # .venv — and `uv sync`, which removes anything the lock does not list,
    # cannot delete the interpreter's pre-commit out from under that hook.
    "pre-commit>=4.0",
    "ruff>=0.9",
    # Pinned, not floored: ty typechecks src/ in CI, it is pre-1.0, and a version
    # bump can turn a green PR red on its own. Dependabot's uv ecosystem bumps this
    # and uv.lock together, so the upgrade arrives as its own reviewable PR rather
    # than landing on whoever opens the next one. (ruff and zizmor are pinned in
    # .pre-commit-config.yaml, which CI reads — see scripts/tool_version.sh.)
    "ty==0.0.91",
    "numpy>=1.24",
    "pydantic>=2.0",
    # Strict YAML parsing for the workflow-structure test: PyYAML silently
    # tolerates the duplicate keys and reparenting that break a workflow.
    "ruamel.yaml>=0.18",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyarrow>=14.0",
    "mcp[cli]>=2.0",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "h5netcdf>=1.0",
    "zarr>=3.0",
    "cfgrib>=0.9.12",
    "eccodes>=2.43",
    "eccodeslib>=2.43; platform_system != 'Windows'",
    "h5py>=3.0",
    "pyproj>=3.0",
]
# The documentation site: `uv run --group docs mkdocs serve`. mkdocstrings
# imports foehn to read its docstrings, so the site is built from what the
# package actually exports, with the vocabulary placeholders already rendered.
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF", "A", "PIE", "PERF", "T20",
    "S",    # flake8-bandit — inline security lint (bandit still runs in CI for the deeper pass)
    "DTZ",  # naive datetimes — a weather library should never build one by accident
    "PTH",  # pathlib over os.path
    # foehn ships py.typed, so an unannotated function hands every caller an Unknown.
    "ANN",
    "BLE",  # a broad except must say why it is broad (each one carries a noqa and a reason)
    "C90",  # cap complexity rather than count branches and statements separately
    "D",    # docstring layout (google convention); missing docstrings are not flagged
    "PL",   # pylint, minus the size heuristics ignored below
    "PT",   # pytest style
    "ARG", "FBT", "FURB", "N", "RET", "SLF",
    # No findings today; each guards a mistake that is cheap to make and easy to miss.
    "ASYNC", "ERA", "EXE", "FA", "FLY", "G", "ICN", "INT", "LOG", "NPY", "PGH", "PYI", "RSE", "SLOT", "TID", "YTT",
]
ignore = [
    "E731",    # lambda assignment — sometimes fine
    "SIM108",  # ternary operator — can hurt readability
    "RUF002",  # en dash in docstrings — intentional for ranges
    "RUF003",  # en dash in comments — intentional for ranges
    "D1",      # missing docstrings: on private helpers the comments say more than a stub would
    "D401",    # imperative mood: many docstrings describe a value ("The instant after which...")
    "D403",    # capitalised first word: docstrings often open with a code name (``cfgrib``)
    "FBT003",  # boolean literals in calls: polars takes values positionally, e.g. fill_null(False)
    "PLC0414", # ``import x as x`` is the explicit re-export spelling
    "PLC0415", # optional dependencies (xarray, cfgrib, h5py, pyspark) are imported where used
    "PLR0911", # return/branch/statement counts: C901 caps complexity instead
    "PLR0912",
    "PLR0915",
    "PLR0913", # public functions are keyword-only and take one argument per filter by design
    "PLR0917",
    "PLR2004", # magic values: thresholds read better inline, next to the comment that explains them
]

[tool.ruff.lint.mccabe]
# The most complex function today is at 15. Raise this deliberately, not by drift.
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/foehn/cli.py" = ["T201"]
"src/foehn/convert.py" = ["T201"]
"src/foehn/mcp_server.py" = ["T201"]
"scripts/*" = ["T201", "PERF203"]
# Tests assert freely, build naive datetimes as fixture values, and open() by
# path is clearer than Path.open() when the path is a plain string literal.
# They are not part of the typed surface, take fixtures they only need for their
# side effects, and reach into private helpers on purpose.
"tests/*" = ["S101", "DTZ001", "PTH123", "ANN", "ARG", "SLF001", "D"]

[tool.coverage.run]
source = ["foehn"]
branch = true

[tool.coverage.report]
# Branch coverage sits at ~99%. What is left is three kinds of unreachable: an
# import-time guard (foehn/__init__.py's polars smoke test, exercised by
# executing its source rather than re-importing the package), a branch needing an
# optional dependency the suite does not install (to_zarr's dask rechunk), and a
# handful of defensive branches on library output. Kept a couple of points below
# so ordinary churn doesn't go red, but a real regression does.
#
# precision is set because the gate is compared against the *rounded* total. At
# the default precision of 0 a run of 96.95% rounded to 97 and passed, while
# pytest-cov printed "FAIL Required test coverage of 97.0% not reached" from its
# own unrounded comparison — a green job with a red line in its log, and half a
# point of slack the floor did not intend to give.
precision = 2
fail_under = 97
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
pythonpath = ["."]
filterwarnings = [
    # Synthetic NetCDF fixtures must not regress to xarray's netCDF4 writer,
    # which triggers NumPy 2.5's deprecated array-shape assignment.
    "error:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning",
]
markers = [
    "live: opt-in tests that hit the live MeteoSwiss STAC/S3 (run with -m live)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foehn"]
