# Declarative Automation Bundle — foehn
#
# Defines two jobs:
#   foehn_daily      — downloads recent data daily at 13:30 UTC, then ingests to Delta
#   foehn_historical — full historical backfill, paused by default (run manually or on Jan 1)
#
# Deploy:
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle deploy -t prod
#
# Run manually:
#   databricks bundle run foehn_daily -t prod
#   databricks bundle run foehn_historical -t prod

bundle:
  name: foehn

# Workspace host is NOT set here — Databricks does not allow variable
# interpolation in auth fields. Authenticate via DATABRICKS_HOST env var,
# a profile in ~/.databrickscfg, or `databricks bundle deploy --profile <name>`.

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: main
  schema:
    description: "Unity Catalog schema name"
    default: meteoswiss
  volume:
    description: "Unity Catalog volume name (landing zone)"
    default: landing
  node_type:
    description: "VM type — Standard_D4ds_v5 (Azure) | m5.xlarge (AWS) | n2-standard-4 (GCP)"
    default: Standard_D4ds_v5
  spark_version:
    default: "17.3.x-scala2.13"
  alert_email:
    description: "Email address to notify on job failure (set via BUNDLE_VAR_alert_email)"
    default: ""

# ── Targets (environments) ────────────────────────────────────────────────────

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev           # isolated catalog for dev runs

  prod:
    mode: production
    variables:
      catalog: main

# ── Shared cluster template ───────────────────────────────────────────────────
# Single-node: download uses requests, CSV parsing uses Polars (streaming).
# Spark runs local[*] only for the Delta table writes — no distributed compute.

_worker: &worker
  job_cluster_key: worker
  new_cluster:
    spark_version: ${var.spark_version}
    node_type_id: ${var.node_type}
    num_workers: 0                        # single-node
    spark_conf:
      spark.master: "local[*]"
      spark.databricks.delta.schema.autoMerge.enabled: "true"
    azure_attributes:
      availability: SPOT_WITH_FALLBACK    # cost savings; remove for AWS/GCP

# ── Jobs ──────────────────────────────────────────────────────────────────────

resources:
  jobs:

    # ── Daily: recent data ────────────────────────────────────────────────────
    foehn_daily:
      name: "[foehn] Daily ingest"
      description: >
        Downloads MeteoSwiss recent data (Jan 1 → yesterday) and refreshes
        Delta tables. Runs daily at 13:30 UTC — 90 min after MeteoSwiss
        publishes the daily update at 12:00 UTC.

      schedule:
        quartz_cron_expression: "0 30 13 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      job_clusters:
        - job_cluster_key: worker
          <<: *worker

      tasks:
        - task_key: download
          description: "foehn --recent → bronze CSVs written to Unity Catalog Volume"
          job_cluster_key: worker
          python_wheel_task:
            package_name: foehn
            entry_point: foehn
            parameters:
              - "download"
              - "--no-parquet"
              - "--data-dir"
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume}"
          libraries:
            - whl: ./dist/foehn-*.whl

        - task_key: ingest
          description: "CSV → Polars (streaming) → Spark → Delta tables in ${var.catalog}.${var.schema}"
          depends_on:
            - task_key: download
          job_cluster_key: worker
          spark_python_task:
            python_file: ./scripts/ingest_delta.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.volume}"
          libraries:
            - whl: ./dist/foehn-*.whl

      email_notifications:
        on_failure:
          - ${var.alert_email}    # set via env: BUNDLE_VAR_alert_email

    # ── Radar precipitation: 5-min year-round (D1) ────────────────────────────
    foehn_radar_precip:
      name: "[foehn] Radar precip (5-min)"
      description: >
        Every 5 minutes year-round: downloads new D1 precipitation radar
        HDF5 files (PRECIP/RZC, PRECIP-SV/TZC, CombiPrecip/CPC, and the
        hourly CPCH reanalysis with 8-day lag) into the UC Volume and
        MERGEs their paths into the radar_precip Delta catalog.
        Runs on serverless — ~30s per run, cold-start in seconds.

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/foehn-*.whl

      tasks:
        - task_key: download
          description: "foehn download --grids radar_precip → HDF5 in UC Volume"
          environment_key: serverless_env
          python_wheel_task:
            package_name: foehn
            entry_point: foehn
            parameters:
              - "download"
              - "--grids"
              - "--no-parquet"
              - "radar_precip"
              - "--data-dir"
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume}"

        - task_key: ingest
          description: "Index new radar_precip HDF5 files into Delta via binaryFile + MERGE"
          depends_on:
            - task_key: download
          environment_key: serverless_env
          spark_python_task:
            python_file: ./scripts/ingest_delta.py
            parameters:
              - "--radar"
              - "radar_precip"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.volume}"

      email_notifications:
        on_failure:
          - ${var.alert_email}

    # ── Radar hail: 5-min Apr–Sep only (D3, seasonal) ─────────────────────────
    foehn_radar_hail:
      name: "[foehn] Radar hail (5-min, Apr–Sep)"
      description: >
        Every 5 minutes during the hail season (April 1 – September 30):
        downloads new D3 hail radar HDF5 files (POH + MESHS) into the UC
        Volume and MERGEs their paths into the radar_hail Delta catalog.
        MeteoSwiss does not publish hail products outside these months, so
        the job is month-restricted at the cron level. Runs on serverless.

      schedule:
        quartz_cron_expression: "0 */5 * ? 4-9 *"
        timezone_id: UTC
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "2"
            dependencies:
              - ./dist/foehn-*.whl

      tasks:
        - task_key: download
          description: "foehn download --grids radar_hail → HDF5 in UC Volume"
          environment_key: serverless_env
          python_wheel_task:
            package_name: foehn
            entry_point: foehn
            parameters:
              - "download"
              - "--grids"
              - "--no-parquet"
              - "radar_hail"
              - "--data-dir"
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume}"

        - task_key: ingest
          description: "Index new radar_hail HDF5 files into Delta via binaryFile + MERGE"
          depends_on:
            - task_key: download
          environment_key: serverless_env
          spark_python_task:
            python_file: ./scripts/ingest_delta.py
            parameters:
              - "--radar"
              - "radar_hail"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.volume}"

      email_notifications:
        on_failure:
          - ${var.alert_email}

    # ── Historical: full archive backfill ─────────────────────────────────────
    foehn_historical:
      name: "[foehn] Historical backfill"
      description: >
        Downloads the full historical MeteoSwiss archive (start of measurement
        → Dec 31 last year). Paused by default — trigger manually for first run
        or after a gap. Scheduled to run automatically on Jan 1 each year to
        pick up the newly released historical slice.

      schedule:
        quartz_cron_expression: "0 0 3 1 1 ?"   # 03:00 UTC on Jan 1
        timezone_id: UTC
        pause_status: PAUSED                     # remove PAUSED for annual auto-run

      job_clusters:
        - job_cluster_key: worker
          <<: *worker

      tasks:
        - task_key: download_historical
          description: "foehn --historical → bronze CSVs in Unity Catalog Volume"
          job_cluster_key: worker
          python_wheel_task:
            package_name: foehn
            entry_point: foehn
            parameters:
              - "download"
              - "--historical"
              - "--full-refresh"
              - "--no-parquet"
              - "--data-dir"
              - "/Volumes/${var.catalog}/${var.schema}/${var.volume}"
          libraries:
            - whl: ./dist/foehn-*.whl

        - task_key: ingest_historical
          description: "CSV → Polars (streaming + chunked) → Spark → Delta tables"
          depends_on:
            - task_key: download_historical
          job_cluster_key: worker
          spark_python_task:
            python_file: ./scripts/ingest_delta.py
            parameters:
              - "--historical"
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.volume}"
          libraries:
            - whl: ./dist/foehn-*.whl

      email_notifications:
        on_failure:
          - ${var.alert_email}
