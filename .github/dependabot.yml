version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    # Don't pull a release the moment it lands. A compromised release is usually
    # yanked within days, so a short soak is cheap supply-chain insurance.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # Split so a breaking major can't hold the safe patches hostage in one PR.
      python-patch-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major

  # The pinned dev toolchain (ruff, zizmor, the hygiene hooks) lives in
  # .pre-commit-config.yaml, and CI reads its versions from there — so bumping
  # this file is what keeps the whole toolchain current.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      pre-commit-patch-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pre-commit-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    # Only default-days here: Dependabot does not treat Action tags as semver,
    # so the semver-*-days keys are rejected for this ecosystem.
    cooldown:
      default-days: 7
    groups:
      github-actions-patch-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
