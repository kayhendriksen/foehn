name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

# A release should never be published twice concurrently; never cancel one either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Used only for the SBOM scratch environment below — the published sdist
      # and wheel are still built by the pinned `python3 -m build`.
      # Caching is deliberately OFF here: this job produces the artifact that
      # gets published, and a poisoned cache entry could reach PyPI.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      # build and twine come from requirements-publish.txt, locked with hashes:
      # this job produces what reaches PyPI, so it installs exactly the bytes
      # that were reviewed. ci.yml's build job reads the same pins — it is this
      # job's smoke test, and only catches its failures if both run the same
      # toolchain. twine < 7 rejects Metadata-Version 2.5, which hatchling emits.
      - name: Resolve pinned SBOM tool
        id: pins
        run: scripts/tool_version.sh cyclonedx-bom | sed 's/^version=/cyclonedx=/' >> "$GITHUB_OUTPUT"
      - run: python3 -m pip install --require-hashes --no-deps -r requirements-publish.txt
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
      - run: python3 -m build
      - run: twine check dist/*
      # CycloneDX SBOM of what actually ships, resolved by installing the built
      # wheel rather than from the pyproject specs. Written outside dist/ — the
      # publish job uploads all of dist/ to PyPI, which would reject a stray file.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Scanned env holds the wheel and nothing else — uv venv omits pip, and
          # the SBOM tool lives in a separate env so its own dependency tree does
          # not leak into foehn's.
          uv venv /tmp/sbomenv --python 3.12
          VIRTUAL_ENV=/tmp/sbomenv uv pip install --quiet dist/*.whl
          uvx --from "cyclonedx-bom==${CYCLONEDX_PIN}" cyclonedx-py environment /tmp/sbomenv \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-file "sbom/foehn-${GITHUB_REF_NAME#v}-sbom.cdx.json"
        env:
          CYCLONEDX_PIN: ${{ steps.pins.outputs.cyclonedx }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can sign: a short-lived Sigstore certificate is minted
    # from the workflow's OIDC identity, so the build job above never holds it.
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - name: Locate the SBOM
        id: files
        run: echo "sbom=$(ls sbom/*.cdx.json)" >> "$GITHUB_OUTPUT"
      # SLSA build provenance for the wheel and the sdist: which workflow, commit
      # and runner built them. Verify with `gh attestation verify <file> --repo
      # kayhendriksen/foehn`, or offline against the bundle attached to the release.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      # The SBOM, bound to the wheel it describes.
      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: ${{ steps.files.outputs.sbom }}
      # Each bundle is a Sigstore-signed in-toto statement. Written one per line
      # — the JSON Lines layout `gh attestation download` uses — under the
      # *.intoto.jsonl name provenance is published with, so the release carries
      # its own verification material next to the files it describes.
      - name: Collect the attestation bundles
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ATTESTATION: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          version="${GITHUB_REF_NAME#v}"
          jq -c . "$PROVENANCE" > "attestations/foehn-${version}.intoto.jsonl"
          jq -c . "$SBOM_ATTESTATION" > "attestations/foehn-${version}-sbom.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations
          path: attestations/

  attach-assets:
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to add the release assets.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestations
          path: attestations/
      # The wheel and sdist exactly as uploaded to PyPI, their SBOM, and the signed
      # provenance for all of them, so a release can be verified from GitHub alone.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* sbom/*.cdx.json attestations/*.intoto.jsonl --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 digital attestations — explicit so a default change upstream
          # can't silently drop them.
          attestations: true

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        # Pinned by version + checksum (this job holds id-token: write, so an
        # unpinned "latest" binary is a supply-chain risk). Dependabot doesn't
        # cover this — bump VERSION and SHA256 together by hand:
        # https://github.com/modelcontextprotocol/registry/releases
        run: |
          VERSION=1.7.9
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
