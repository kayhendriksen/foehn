name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

# A release should never be published twice concurrently; never cancel one either.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Used only for the SBOM scratch environment below — the published sdist
      # and wheel are still built by the pinned `python3 -m build`.
      # Caching is deliberately OFF here: this job produces the artifact that
      # gets published, and a poisoned cache entry could reach PyPI.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      # Pinned: this job builds the published artifact. Bump manually —
      # Dependabot doesn't track inline pip installs in workflows.
      # Keep in step with BUILD_VERSION/TWINE_VERSION in ci.yml, whose build job
      # is the smoke test for this one. twine < 7 rejects Metadata-Version 2.5,
      # which hatchling now emits.
      - run: pip install build==1.6.0 twine==7.0.0
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
      - run: python3 -m build
      - run: twine check dist/*
      # CycloneDX SBOM of what actually ships, resolved by installing the built
      # wheel rather than from the pyproject specs. Written outside dist/ — the
      # publish job uploads all of dist/ to PyPI, which would reject a stray file.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Scanned env holds the wheel and nothing else — uv venv omits pip, and
          # the SBOM tool lives in a separate env so its own dependency tree does
          # not leak into foehn's.
          uv venv /tmp/sbomenv --python 3.12
          VIRTUAL_ENV=/tmp/sbomenv uv pip install --quiet dist/*.whl
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment /tmp/sbomenv \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-file "sbom/foehn-${GITHUB_REF_NAME#v}-sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  attach-sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to add the SBOM as a release asset.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Upload SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom/*.cdx.json --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # PEP 740 digital attestations — explicit so a default change upstream
          # can't silently drop them.
          attestations: true

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        # Pinned by version + checksum (this job holds id-token: write, so an
        # unpinned "latest" binary is a supply-chain risk). Dependabot doesn't
        # cover this — bump VERSION and SHA256 together by hand:
        # https://github.com/modelcontextprotocol/registry/releases
        run: |
          VERSION=1.7.9
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v${VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
      - name: Authenticate and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
