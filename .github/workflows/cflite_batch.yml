name: ClusterFuzzLite batch fuzzing

# A longer weekly run of every fuzz target. It finds what a few minutes per PR
# does not, and it grows the corpus the PR runs start from (kept as a workflow
# artifact). See cflite_pr.yml for what is fuzzed.
on:
  schedule:
    - cron: "30 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (batch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
          mode: batch
          fuzz-seconds: 3600
          github-token: ${{ secrets.GITHUB_TOKEN }}
