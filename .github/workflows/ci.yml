name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same PR. Pushes to main are never cancelled —
# each main commit should get a complete, attributable result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ruff, zizmor and ty are NOT pinned here: they live in .pre-commit-config.yaml
# and the pyproject dev extra, both of which Dependabot bumps, and the jobs below
# read the versions from there. They used to be duplicated here and kept in step
# by hand, and a silent mismatch means local hooks and CI disagree about what
# "clean" means. The pins that remain are single-copy, so they cannot drift.
env:
  PIP_AUDIT_VERSION: "2.9.0"
  # Must match the pins in publish.yml — the build job below is that job's smoke
  # test, and only catches its failures if it runs the same toolchain.
  BUILD_VERSION: "1.6.0"
  TWINE_VERSION: "7.0.0"
  BANDIT_VERSION: "1.9.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Resolve pinned ruff
        id: ruff
        run: scripts/hook_version.sh ruff-pre-commit >> "$GITHUB_OUTPUT"
      # scripts/ is linted too — ingest_delta.py builds Spark SQL by hand and is
      # the highest-risk file in the repo.
      # Via env rather than expanding ${{ }} straight into the run block, which
      # is the template-injection shape zizmor flags.
      - run: uvx "ruff@${RUFF_PIN}" check src/ tests/ scripts/
        env:
          RUFF_PIN: ${{ steps.ruff.outputs.version }}
      - run: uvx "ruff@${RUFF_PIN}" format --check src/ tests/ scripts/
        env:
          RUFF_PIN: ${{ steps.ruff.outputs.version }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # foehn ships py.typed, so downstream type checkers trust these annotations.
      # Nothing verified them before this job existed.
      - run: uv venv --python 3.12
      # ty is pinned in the pyproject dev extra, so Dependabot bumps it there.
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ty check src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      # Coverage floor lives in [tool.coverage.report] fail_under in pyproject.toml.
      - run: .venv/bin/pytest --cov=foehn --cov-report=term-missing

  test-prerelease:
    # Python's 3.15 call-to-action asks maintainers to test against the preview.
    # Non-blocking on purpose: this tracks upstream readiness, and a red preview
    # leg must never gate a PR.
    name: test (3.15 preview, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv venv --python 3.15
      # Core + mcp only. The grids stack has no 3.15 wheels yet (pandas, pyproj,
      # netCDF4, h5py, pyarrow), so installing [dev] here would fail on packaging
      # rather than on anything foehn controls.
      - run: uv pip install -e ".[mcp]" "pytest>=8"
      - run: .venv/bin/pytest --ignore=tests/test_grids.py -p no:cov

  build:
    name: build (packaging smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # publish.yml only builds at release time, from a tag-triggered job. Without
      # this, a broken pyproject.toml or missing package data surfaces mid-release
      # instead of in the PR that caused it.
      - run: uvx --from build==${BUILD_VERSION} pyproject-build
      - run: uvx twine@${TWINE_VERSION} check dist/*
      # Confirm the built wheel actually imports and exposes its entry point,
      # rather than only that it is well-formed metadata.
      - run: uv venv --python 3.12 /tmp/wheeltest
      - run: VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
      - run: /tmp/wheeltest/bin/foehn --help
      - run: /tmp/wheeltest/bin/python -c "import foehn; print(foehn.__version__)"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Audit the *fully resolved* tree across every extra — including grids
      # (netCDF4/h5py/eccodes/cfgrib/pyproj), which the previous hand-built
      # requirements list left unaudited despite being C-library-backed.
      - name: Resolve full dependency tree (all extras)
        run: uv pip compile --quiet --all-extras pyproject.toml -o requirements-audit.txt
      - name: Audit dependencies
        run: uvx pip-audit@${PIP_AUDIT_VERSION} -r requirements-audit.txt --progress-spinner off
      # scripts/ included — see the lint job.
      - name: Static security scan
        run: uvx bandit@${BANDIT_VERSION} -r src/ scripts/ -q

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload findings to the Security tab, alongside CodeQL and Scorecard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # Static analysis for the workflows themselves: template injection, unpinned
      # actions, credential persistence, over-broad permissions. Clean as of this
      # commit — the point is to keep it that way as workflows change.
      - name: Resolve pinned zizmor
        id: zizmor
        run: scripts/hook_version.sh zizmor-pre-commit >> "$GITHUB_OUTPUT"
      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_PIN}" --format sarif .github/workflows/ > zizmor.sarif
        env:
          ZIZMOR_PIN: ${{ steps.zizmor.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: zizmor.sarif
          category: zizmor
