name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same PR. Pushes to main are never cancelled —
# each main commit should get a complete, attributable result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No tool versions here. Every pin lives in the one file Dependabot can bump —
# .pre-commit-config.yaml for the tools that also run as local hooks,
# requirements-ci.txt for the ones only CI runs, the pyproject dev group for ty —
# and the jobs resolve it with scripts/tool_version.sh. Duplicating a version
# into this block is how they went unbumped, and how build/twine drifted out of
# step with publish.yml.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Resolve pinned ruff
        id: ruff
        run: scripts/tool_version.sh ruff-pre-commit >> "$GITHUB_OUTPUT"
      # scripts/ is linted too — ingest_delta.py builds Spark SQL by hand and is
      # the highest-risk file in the repo.
      # Via env rather than expanding ${{ }} straight into the run block, which
      # is the template-injection shape zizmor flags.
      - run: uvx "ruff@${RUFF_PIN}" check src/ tests/ scripts/
        env:
          RUFF_PIN: ${{ steps.ruff.outputs.version }}
      - run: uvx "ruff@${RUFF_PIN}" format --check src/ tests/ scripts/
        env:
          RUFF_PIN: ${{ steps.ruff.outputs.version }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # foehn ships py.typed, so downstream type checkers trust these annotations.
      # Nothing verified them before this job existed.
      # ty is pinned in the pyproject dev group, so Dependabot bumps it there.
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run --no-sync ty check src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # From the lockfile, so CI tests the versions uv.lock pins, and fails if the
      # lock no longer matches pyproject.toml. A fresh `uv pip install` resolved
      # around the lock instead: CI stayed green while `uv sync` produced an
      # environment whose GRIB2 tests could not pass.
      - run: uv sync --locked --group dev
      # Coverage floor lives in [tool.coverage.report] fail_under in pyproject.toml.
      - run: uv run --no-sync pytest --cov=foehn --cov-report=term-missing

  test-315:
    # Python 3.15 is released (3.15.0 on 2026-10-09), so this leg blocks like the
    # others. It cannot install [dev] yet: h5py, eccodeslib and numcodecs (zarr)
    # ship no cp315 wheels, so the radar, GRIB2 and Zarr paths are not installable
    # here. Everything that is installable is, and the tests that need the rest
    # skip themselves. No coverage floor: the floor is measured with the whole
    # grids stack present. Fold this into the matrix above once those wheels land.
    name: test (3.15)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv venv --python 3.15
      - run: >-
          uv pip install --only-binary numpy,pyarrow,xarray,netCDF4,pyproj
          -e ".[mcp]" "pytest>=8" "ruamel.yaml>=0.18"
          "numpy>=1.24" "pyarrow>=14.0" "xarray>=2024.1" "netCDF4>=1.6" "pyproj>=3.0"
      - run: .venv/bin/pytest -p no:cov

  build:
    name: build (packaging smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # publish.yml only builds at release time, from a tag-triggered job. Without
      # this, a broken pyproject.toml or missing package data surfaces mid-release
      # instead of in the PR that caused it.
      - name: Resolve pinned build
        id: build
        run: scripts/tool_version.sh build >> "$GITHUB_OUTPUT"
      - name: Resolve pinned twine
        id: twine
        run: scripts/tool_version.sh twine >> "$GITHUB_OUTPUT"
      - name: Resolve pinned hatchling
        id: hatchling
        run: scripts/tool_version.sh hatchling >> "$GITHUB_OUTPUT"
      # --no-isolation with the pinned hatchling, as publish.yml builds.
      - run: uvx --from "build==${BUILD_PIN}" --with "hatchling==${HATCHLING_PIN}" pyproject-build --no-isolation
        env:
          BUILD_PIN: ${{ steps.build.outputs.version }}
          HATCHLING_PIN: ${{ steps.hatchling.outputs.version }}
      - run: uvx "twine@${TWINE_PIN}" check dist/*
        env:
          TWINE_PIN: ${{ steps.twine.outputs.version }}
      # Confirm the built wheel actually imports and exposes its entry point,
      # rather than only that it is well-formed metadata.
      - run: uv venv --python 3.12 /tmp/wheeltest
      - run: VIRTUAL_ENV=/tmp/wheeltest uv pip install dist/*.whl
      - run: /tmp/wheeltest/bin/foehn --help
      - run: /tmp/wheeltest/bin/python -c "import foehn; print(foehn.__version__)"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # Audit the *fully resolved* tree across every extra — including grids
      # (netCDF4/h5py/eccodes/cfgrib/pyproj), which the previous hand-built
      # requirements list left unaudited despite being C-library-backed.
      - name: Resolve full dependency tree (all extras)
        run: uv pip compile --quiet --all-extras pyproject.toml -o requirements-audit.txt
      - name: Resolve pinned pip-audit
        id: pip_audit
        run: scripts/tool_version.sh pip-audit >> "$GITHUB_OUTPUT"
      - name: Audit dependencies
        run: uvx "pip-audit@${PIP_AUDIT_PIN}" -r requirements-audit.txt --progress-spinner off
        env:
          PIP_AUDIT_PIN: ${{ steps.pip_audit.outputs.version }}
      - name: Resolve pinned bandit
        id: bandit
        run: scripts/tool_version.sh bandit >> "$GITHUB_OUTPUT"
      # scripts/ included — see the lint job.
      - name: Static security scan
        run: uvx "bandit@${BANDIT_PIN}" -r src/ scripts/ -q
        env:
          BANDIT_PIN: ${{ steps.bandit.outputs.version }}

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload findings to the Security tab, alongside CodeQL and Scorecard.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      # Static analysis for the workflows themselves: template injection, unpinned
      # actions, credential persistence, over-broad permissions. Clean as of this
      # commit — the point is to keep it that way as workflows change.
      - name: Resolve pinned zizmor
        id: zizmor
        run: scripts/tool_version.sh zizmor-pre-commit >> "$GITHUB_OUTPUT"
      - name: Run zizmor
        run: uvx "zizmor@${ZIZMOR_PIN}" --format sarif .github/workflows/ > zizmor.sarif
        env:
          ZIZMOR_PIN: ${{ steps.zizmor.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor
