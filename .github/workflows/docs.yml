name: Docs

# Builds the MkDocs site on every pull request and push, with --strict so a
# broken link or a docstring the API reference cannot render fails the PR that
# caused it. Publishes to GitHub Pages only on a release (and by hand), so the
# site documents what PyPI serves rather than whatever main holds that day.
# Pages must be enabled once, with "GitHub Actions" as its source.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: this job builds what gets published to Pages, and a poisoned
      # cache entry could reach the site (the same rule as publish.yml).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      # foehn itself and the docs group: mkdocstrings imports the package to
      # read its rendered docstrings, but needs none of the test tooling.
      - run: uv sync --locked --no-default-groups --group docs --python 3.12
      - run: uv run --no-sync mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can publish: Pages deploys with a short-lived OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
