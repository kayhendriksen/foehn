site_name: foehn
site_description: MeteoSwiss Open Government Data as Polars DataFrames, Parquet, xarray and Zarr — Python API, CLI and MCP server.
site_url: https://kayhendriksen.github.io/foehn/
site_author: Kay Hendriksen
repo_url: https://github.com/kayhendriksen/foehn
repo_name: kayhendriksen/foehn
edit_uri: edit/main/docs/
copyright: Data © MeteoSwiss, Open Government Data. foehn is MIT licensed.

# docs/agents/ holds local notes for coding agents; it is not part of the site.
exclude_docs: |
  agents/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - User guide:
      - Collections: collections.md
      - Python API: python-api.md
      - Gridded data: grids.md
      - Command line: cli.md
      - MCP server: mcp-server.md
      - Databricks pipeline: databricks.md
  - Reference:
      - Python API: reference/api.md
      - Command line: cli.md
  - Changelog: changelog.md
  - Contributing: https://github.com/kayhendriksen/foehn/blob/main/CONTRIBUTING.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # The changelog page includes CHANGELOG.md from the repository root.
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            # Import foehn rather than only parsing it: the public docstrings
            # are rendered at import time ($granularities and friends become
            # the real vocabulary), and the import is what users see.
            force_inspection: true
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            # Inspection sees the dataclass machinery (__dataclass_fields__ and
            # friends) as members; only the public names belong on the page.
            filters: ["!^_"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
